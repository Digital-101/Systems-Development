<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Insurance</title>
    <style>
        h1{
            color: #007bff;
        }
        header{
            background-color: aquamarine;
        }
        nav {
               justify-content: center;
               display: flex;
               width: 100%;
               text-align: center;
           }
           
           nav ul {
               display: flex;
               list-style-type: none;
           }
           
           nav li {
               padding-left: 20px;
               text-align: center;
               width: 80;
           }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            align-items: center;
            text-align: center;
            justify-content: center;
            display: flex;
        }
        main{
            text-align: center;
            width: 90%;
            background-color: rgb(64, 218, 64);
            border-radius: 12px;
        }
        img{
            width: 300px;
            height: auto;
            border-radius: 12px;
        }
        p{
            font-size: 16px;
            letter-spacing: 1.6;
            margin: 20px, 20px, 0, 0;
            color: white;
        }
        button{
            background-color: #007bff;
            color: white;
            font-size: 16px;
            padding: 4px;
            border-radius: 12px;
        }
     
        .container{
            background-color: aquamarine;
            align-items: center;
            justify-content: center;
            display: block;
        }
        a:hover{background-color: goldenrod;}
    </style>
</head>
<body>

    <main id="changeBG">
        <header>
            <nav>
                <ul>
                    <li> <a href="#">Claims</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">Policy</a></li>
                    <li><a href="#">Get Help</a></li>
                    <li><a href="#">Contacts</a></li>
                </ul>
            </nav>
        </header>
        <h1>Car Insurance</h1>
        <p id="changeSize">Our Car Insurance service covers costs and comes with benefits</p>
        <p>View: <a href="Services.html" target="_blank">Our Services</a></p>
        <img id="changeIMG" src="cover1.jpg" alt="" width="200px" height="200px">
        <br>
        <button type="button" onclick="document.getElementById('changeIMG').src='cover2.jpg'">Change Image</button>
        <button type="button" onclick="document.getElementById('changeSize').style.fontSize='larger'">Change Font</button>
        <button type="button" onclick="document.getElementById('changeBG').style.backgroundColor='gold'">Change Background</button>    
        <hr>
        <div class="container">
            <h3>Get a Personal Quote:</h3>
            <form id="quote">
                Title: <input type="text" name="title" id=""><br>
                First Name: <input type="text" name="fname" id=""><br>
                Surname: <input type="text" name="lname" id=""><br>
                Phone: <input type="text" name="phone" id="" required><br>
                Email: <input type="text" name="email" id="" required>
                <div id="output">
                </div>
                <br><br>
                <input type="button" value="Submit" onclick="getQuote()">
            </form>
        </div>
        <hr>
        <footer>&copy; 2024 Designed by: <a href="#">Wandy</a></footer>
    </main>
    <br>
  <script>
        function getQuote() {
            // Get form values
            const title = document.querySelector('input[name="title"]').value;
            const firstName = document.querySelector('input[name="fname"]').value;
            const surname = document.querySelector('input[name="lname"]').value;
            const phone = document.querySelector('input[name="phone"]').value;
            const email = document.querySelector('input[name="email"]').value;

            // Create a quote message
            const quoteMessage = `
                Thank you, ${title} ${firstName} ${surname}!
                We will contact you at ${phone} or ${email} with your personal quote.
            `;

            // Display the quote message in the output div
            document.getElementById('output').innerText = quoteMessage;
        }
   
  </script>
</body>
</html>
