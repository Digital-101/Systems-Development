<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Management</title>
  <style>
    /* Basic Layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background-color: #f4f6f8;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding-top: 20px;
      height: 100vh;
      position: fixed;
    }

    .sidebar a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: white;
      font-size: 1.1em;
      margin: 10px 0;
    }

    .sidebar a:hover {
      background-color: #34495e;
    }

    .sidebar .active {
      background-color: #16a085;
    }

    /* Content Styles */
    .content {
      margin-left: 240px;
      padding: 30px;
      width: calc(100% - 240px);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    /* Filter Section */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filters input, .filters select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    td img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }

    .action-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-accept {
      background-color: #27ae60;
      color: white;
    }

    .btn-reject {
      background-color: #e74c3c;
      color: white;
    }

    .btn-accept:hover {
      background-color: #2ecc71;
    }

    .btn-reject:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2 style="text-align: center; color: white;">Admin Panel</h2>
    <a href="#">Dashboard</a>
    <a href="#">Doctors</a>
    <a href="#">Patients</a>
    <a href="#" class="active">Appointments</a>
    <a href="#">Transactions</a>
    <a href="#">Notifications</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h1>Manage Appointments</h1>

    <!-- Filter Section -->
    <div class="filters">
      <input type="text" id="filterName" placeholder="Filter by Patient Name">
      <input type="date" id="filterDate">
      <select id="filterStatus">
        <option value="">Filter by Status</option>
        <option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option>
        <option value="pending">Pending</option>
      </select>
      <button onclick="applyFilters()">Apply Filters</button>
    </div>

    <!-- Appointment Table -->
    <table>
      <thead>
        <tr>
          <th>Picture</th>
          <th>Name</th>
          <th>Email</th>
          <th>Timestamp</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable">
        <!-- Sample Rows -->
        <tr>
          <td><img src="https://images.unsplash.com/photo-1723221890385-6949a72be9da?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bmlnZXJpYW4lMjBtYW58ZW58MHx8MHx8fDA%3D" alt="Patient Image"></td>
          <td>Maduka Achebe</td>
          <td>maduka@applicenta.com</td>
          <td>2025-01-25 14:30</td>
          <td>Pending</td>
          <td>
            <button class="action-btn btn-accept" onclick="changeStatus('accepted', this)">Accept</button>
            <button class="action-btn btn-reject" onclick="changeStatus('rejected', this)">Reject</button>
          </td>
        </tr>
        <tr>
          <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiAJCGDBxX6X89ZThVP9dnU9-Wou5_PKwONNrKW9E3GFRogTY-M8oOZnr9HTK84i_cWXA&usqp=CAU" alt="Patient Image"></td>
          <td>Oluwaseun Adebayo</td>
          <td>oluwaseun@applicenta.com</td>
          <td>2025-01-26 09:00</td>
          <td>Pending</td>
          <td>
            <button class="action-btn btn-accept" onclick="changeStatus('accepted', this)">Accept</button>
            <button class="action-btn btn-reject" onclick="changeStatus('rejected', this)">Reject</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Function to handle appointment status changes
    function changeStatus(status, button) {
      const row = button.closest('tr');
      const statusCell = row.querySelectorAll('td')[4];
      statusCell.textContent = status.charAt(0).toUpperCase() + status.slice(1);

      const actionButtonCell = row.querySelectorAll('td')[5];
      actionButtonCell.innerHTML = `<span style="color: ${status === 'accepted' ? '#27ae60' : '#e74c3c'}; font-weight: bold;">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
    }

    // Function to apply filters
    function applyFilters() {
      const nameFilter = document.getElementById('filterName').value.toLowerCase();
      const dateFilter = document.getElementById('filterDate').value;
      const statusFilter = document.getElementById('filterStatus').value;

      const rows = document.querySelectorAll('#appointmentsTable tr');

      rows.forEach(row => {
        const name = row.cells[1].textContent.toLowerCase();
        const date = row.cells[3].textContent.split(' ')[0];
        const status = row.cells[4].textContent.toLowerCase();

        const matchesName = name.includes(nameFilter);
        const matchesDate = dateFilter ? date === dateFilter : true;
        const matchesStatus = statusFilter ? status === statusFilter : true;

        if (matchesName && matchesDate && matchesStatus) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
