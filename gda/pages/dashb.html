<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    /* Basic Layout */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background-color: #f4f6f8;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: white;
      padding-top: 20px;
      height: 100vh;
      position: fixed;
    }

    .sidebar h2 {
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }

    .sidebar a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: white;
      font-size: 1.1em;
      margin: 10px 0;
    }

    .sidebar a:hover {
      background-color: #34495e;
    }

    .sidebar .active {
      background-color: #16a085;
    }

    /* Content Styles */
    .content {
      margin-left: 240px;
      padding: 20px;
      width: calc(100% - 240px);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    /* Dashboard Cards */
    .dashboard-cards {
      display: flex;
      justify-content: space-around;
      margin-bottom: 40px;
    }

    .card {
      background-color: #ecf0f1;
      width: 22%;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      margin: 10px 0;
      font-size: 1.8em;
      color: #2c3e50;
    }

    .card p {
      font-size: 1.2em;
      color: #16a085;
    }

    /* Image Container */
    .charts {
      display: flex;
      justify-content: space-between;
    }

    .chart {
      width: 48%;
    }

    .chart img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#" class="active">Dashboard</a>
    <a href="#">Doctors</a>
    <a href="#">Patients</a>
    <a href="#">Appointments</a>
    <a href="#">Transactions</a>
    <a href="#">Notifications</a>
    <a href="#">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h1>Admin Dashboard</h1>

    <!-- Dashboard Stats Cards -->
    <div class="dashboard-cards">
      <div class="card">
        <h3>Total Doctors</h3>
        <p>15</p>
      </div>
      <div class="card">
        <h3>Total Patients</h3>
        <p>30</p>
      </div>
      <div class="card">
        <h3>Total Appointments</h3>
        <p>110</p>
      </div>
      <div class="card">
        <h3>Total Earnings</h3>
        <p>R24,000</p>
      </div>
    </div>

    <!-- Images instead of Charts -->
    <div class="charts">
      <!-- Appointments & Earnings Image -->
      <div class="chart">
        <img src="https://raw.githubusercontent.com/Digital-101/LearningNode/refs/heads/master/doc.png" alt="Appointments & Earnings Chart">
      </div>

      <!-- Doctors & Patients Image -->
      <div class="chart">
        <img src="https://raw.githubusercontent.com/Digital-101/LearningNode/refs/heads/master/pat.png" alt="Doctors & Patients Chart">
      </div>
    </div>
  </div>

</body>
</html>
